[project]
name = "my-panproto-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "panproto>=0.71.0",
]

# Project metadata for your own tooling. panproto does not read it: the
# CLI reads a `panproto.toml` manifest, and the SDK takes the protocol as
# an argument to `get_builtin_protocol`.
[tool.panproto]
protocol = "atproto"
schemas_path = "schemas/"
